  - name: "Weekend Service"
    date: "2026-02-14"
    day_of_week: "Saturday"
    reporting_time: "2:00 PM"
    roster:
      - role: lead
        member_id: 
      - role: support
        member_id:
  
  - name: "Weekend Service"
    date: "2026-02-15"
    day_of_week: "Sunday"
    reporting_time: "9:00 AM"
    roster:
      - role: lead
        member_id: member-1-alice  # Pre-assigned to Alice
  
  - name: "Weekend Service"
    date: "2026-02-28"
    day_of_week: "Saturday"
    reporting_time: "2:00 PM"
    roster:
      - role: lead
        member_id:
      - role: support
        member_id:
  
