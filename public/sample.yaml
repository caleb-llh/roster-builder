#################################
#### Define the roster scope ####
#################################

# The roster period defines the date range for scheduling
roster:
  start_date: "2026-02-01"  # First day of the roster period
  end_date: "2026-03-31"     # Last day of the roster period

# Define all roles that need to be filled in events
roles:
  - name: lead      # Primary role - leads the event
  - name: support   # Supporting role - assists the lead
  - name: backup    # Backup role - covers when others are unavailable

###########################
#### Define the supply ####
###########################

# List all team members who can be assigned to events
# Fields:
#   id: unique identifier (used in constraints/preferences/events)
#   name: full display name
#   telegram: Telegram handle for notifications
#   include: whether to include in automatic roster generation
#   roles: list of roles this member can perform

members:
  - id: member-1-alice
    name: Alice Johnson
    telegram: "@alice"
    include: true    # Include in roster generation
    roles:
      - lead         # Can perform all three roles
      - support
      - backup
  
  - id: member-2-bob
    name: Bob Smith
    telegram: "@bob"
    include: true
    roles:
      - lead         # Can perform lead and support
      - support
  
  - id: member-3-charlie
    name: Charlie Davis
    telegram: "@charlie"
    include: true
    roles:
      - support      # Can perform support and backup
      - backup
  
  - id: member-4-diana
    name: Diana Lee
    telegram: "@diana"
    include: true
    roles:
      - support
      - backup
  
  - id: member-5-ethan
    name: Ethan Brown
    telegram: "@ethan"
    include: false   # Not included in roster generation (inactive)
    roles:
      - backup

###########################
#### Define the demand ####
###########################

# List all events that need roster assignments
# Fields:
#   name: descriptive name of the event
#   date: event date (YYYY-MM-DD format)
#   day_of_week: day of the week
#   reporting_time: when members should arrive (24-hour format HH:MM)
#   roster: list of roles and assigned member IDs (leave member_id empty for unassigned)
#   reminder: optional message sent to assigned members

events:
  - name: "Weekend Service"
    date: "2026-02-07"
    day_of_week: "Saturday"
    reporting_time: "2:00 PM"
    roster:
      - role: lead
        member_id:           # Leave empty for automatic assignment
      - role: support
        member_id:
    reminder: "Remember to arrive 30 minutes early."
  
  - name: "Weekend Service"
    date: "2026-02-08"
    day_of_week: "Sunday"
