#########################################################
#### Constraints at the roster level ####
#########################################################

# HARD constraints that MUST be fulfilled for valid assignments
# The roster generator will never violate these rules

roster_constraints:
  ENFORCE_MEMBER_ROLES: true              # Members can only be assigned roles they can perform
  ENFORCE_MEMBER_AVAILABILITY: true       # Members won't be assigned when unavailable
  ONLY_ONCE_PER_EVENT: true               # A member can't be assigned multiple roles in one event
  ONLY_ONCE_PER_WEEK: true                # A member can't be assigned multiple times in one week (Mon-Sun)
  MAX_ASSIGNMENTS_PER_MONTH: 2            # Maximum number of assignments per member per month

#########################################################
#### Preferences at the roster level ####
#########################################################  

# SOFT preferences - the generator tries to satisfy these but may not always succeed
# These help create fair and balanced rosters

roster_preferences:
  AVOID_CONSECUTIVE_WEEKS: true           # Try to avoid assigning members on back-to-back weekends
  BALANCED_DAY_DISTRIBUTION: true         # Distribute assignments evenly across different days of the week
  SPREAD_ASSIGNMENTS: true                # Spread assignments evenly across the entire roster period
  DIVERSIFY_ROLE_ASSIGNMENTS: true        # Maximize variety - rotate different members through each role

#####################################################################
#### Constraints at the member level (overrides roster level) ####
#####################################################################

# Member-specific HARD constraints (override roster-level settings)
# Use this to mark when members are unavailable
# Formats:
#   Single date: "YYYY-MM-DD"
#   Date range:
#     start: "YYYY-MM-DD"
#     end: "YYYY-MM-DD"

member_constraints: 
  - member_id: member-2-bob
    unavailable_dates:
      - "2026-02-14"         # Single unavailable date
      - "2026-02-15"         # Another single date
  
  - member_id: member-3-charlie
    unavailable_dates:
      - start: "2026-02-21"  # Date range - unavailable from Feb 21-28
        end: "2026-02-28"
  
  - member_id: member-4-diana
    unavailable_dates:
      - start: "2026-03-05"  # Date range - unavailable from Mar 5-10
        end: "2026-03-10"

##################################################################
#### Preferences at the member level (overrides roster level) ####
##################################################################

# Member-specific SOFT preferences (overrides roster-level settings)
# Use this to indicate preferred days for assignment
# The generator will try to honor these when possible

member_preferences: 
  - member_id: member-1-alice
    days:
      - Sunday             # Prefers Sunday assignments
  
  - member_id: member-4-diana
    days:
      - Saturday           # Prefers Saturday assignments
    roles:
      - support            # Prefers support role
